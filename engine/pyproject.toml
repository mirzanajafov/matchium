[project]
name = "matchium-engine"
version = "0.1.0"
description = "Matching engine and simulator for Matchium"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "psycopg[binary]>=3.2", "ruff==0.17.1", "mypy==2.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["matchium", "sim", "jobs"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "CPY",
    "COM812",
    "ISC001",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ARG001",
    "ARG005",
    "B008",
    "B905",
    "C420",
    "E501",
    "EM101",
    "F541",
    "FBT001",
    "FBT002",
    "FBT003",
    "ISC004",
    "N818",
    "PERF401",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PT018",
    "RUF022",
    "RUF046",
    "RUF059",
    "S105",
    "S310",
    "S318",
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"jobs/**" = ["T201"]
"sim/run.py" = ["T201"]

[tool.mypy]
strict = true
files = ["matchium", "sim", "jobs", "tests"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["matchium.selection"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["matchium.revealed"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["sim.run", "tests.test_nightly"]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = ["tests.test_engine"]
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.test_scheduler"]
disable_error_code = ["var-annotated", "func-returns-value"]
