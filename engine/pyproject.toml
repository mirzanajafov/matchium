[project]
name = "matchium-engine"
version = "0.1.0"
description = "Matching engine and simulator for Matchium"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "psycopg[binary]>=3.2"]
lint = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["matchium", "sim", "jobs"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "CPY",
    "COM812",
    "B008",
    "E501",
    "EM101",
    "FBT001",
    "FBT002",
    "FBT003",
    "ISC004",
    "N818",
    "PERF401",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PT018",
    "RUF022",
    "RUF046",
    "S105",
    "S310",
    "S318",
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"jobs/**" = ["T201"]
"sim/run.py" = ["T201"]

[tool.mypy]
strict = true
files = ["matchium", "sim", "jobs", "tests"]
