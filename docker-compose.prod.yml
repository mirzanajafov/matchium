services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped

  mailpit:
    profiles: ["dev"]

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  matcher:
    environment:
      DATABASE_URL: postgresql://matchium:${POSTGRES_PASSWORD}@postgres:5432/matchium

  api:
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://matchium:${POSTGRES_PASSWORD}@postgres:5432/matchium
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WEB_URL: ${WEB_URL:?set WEB_URL}
      SMTP_URL: ${SMTP_URL:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  web:
    ports: !reset []
    environment:
      TRUSTED_PROXY_HOPS: "1"
    networks:
      - default
      - edge

  backup:
    build: ./deploy/backup
    container_name: matchium-backup
    profiles: ["app"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGUSER: matchium
      PGDATABASE: matchium
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RUN_AT: ${BACKUP_AT:-04:00}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - photos:/photos:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    name: ${EDGE_NETWORK:?set EDGE_NETWORK}
    external: true
