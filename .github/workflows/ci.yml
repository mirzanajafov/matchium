name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Contract is up to date
        run: |
          python -m matchium.contract
          git diff --exit-code -- ../contract

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchium
          POSTGRES_PASSWORD: matchium
          POSTGRES_DB: matchium_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U matchium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - working-directory: api
        run: npm ci
      - working-directory: api
        run: npx prisma generate
      - working-directory: api
        run: npm run lint
      - working-directory: api
        run: npm test
      - working-directory: api
        run: npm run test:e2e
      - working-directory: api
        run: npm run build
      - name: Nightly job against the migrated database
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          pytest -q -rs tests/test_nightly.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
