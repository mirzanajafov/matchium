name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev,lint]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchium
          POSTGRES_PASSWORD: matchium
          POSTGRES_DB: matchium_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U matchium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - working-directory: api
        run: npm ci
      - working-directory: api
        run: npx prisma generate
      - working-directory: api
        run: npm run lint
      - working-directory: api
        run: npm run format:check
      - working-directory: api
        run: npm run typecheck
      - working-directory: api
        run: npm test
      - working-directory: api
        run: npm run test:e2e
      - working-directory: api
        run: npm run build
      - name: Nightly job against the migrated database
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          pytest -q -rs tests/test_nightly.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build what a deploy builds
        env:
          POSTGRES_PASSWORD: ci
          MINIO_ROOT_PASSWORD: ci
          JWT_SECRET: placeholder-secret
          WEB_URL: http://localhost:3101
          EDGE_NETWORK: edge
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app build
      - name: Migrate and start the app without MinIO
        env:
          S3_ENDPOINT: ""
        run: docker compose --profile app up --detach --wait --wait-timeout 180 api web matcher
      - name: Run the nightly job once against the migrated database
        run: docker compose --profile app run --rm matcher python -m jobs.nightly
      - if: failure()
        run: |
          docker compose --profile app logs
          docker inspect -f '{{.Name}} {{json .State.Health}}' matchium-api matchium-web

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: deploy/backup/test.sh

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: deploy/test.sh

  env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Env files stay out of git, examples stay in
        run: |
          for path in .env .env.production .env.test.local .envrc api/.env api/.env.production engine/.env web/.env web/.env.local web/.env.test; do
            if ! git check-ignore -q --no-index "$path"; then echo "$path would be committed"; exit 1; fi
          done
          for path in .env.example api/.env.example engine/.env.example web/.env.example; do
            if git check-ignore -q --no-index "$path"; then echo "$path would be ignored"; exit 1; fi
          done
          tracked=$(git ls-files --cached --ignored --exclude-standard -- ':(glob)**/.env*')
          if [ -n "$tracked" ]; then echo "tracked although ignored: $tracked"; exit 1; fi
