services:
  postgres:
    image: postgres:17-alpine
    container_name: matchium-postgres
    environment:
      POSTGRES_USER: matchium
      POSTGRES_PASSWORD: matchium
      POSTGRES_DB: matchium
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "matchium"]
      interval: 5s
      retries: 10

  matcher:
    build: ./engine
    container_name: matchium-matcher
    profiles: ["jobs", "app"]
    environment:
      DATABASE_URL: postgresql://matchium:matchium@postgres:5432/matchium
      MATCH_AT: "03:00"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: matchium-api
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://matchium:matchium@postgres:5432/matchium
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret}
      TRUST_PROXY: uniquelocal
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:push@example.com}
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    container_name: matchium-web
    profiles: ["app"]
    environment:
      API_URL: http://api:3100
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "3101:3101"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
